<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where is Benny? — find the dog (Three.js r128)</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
body{background:#0a0a0c;color:#e0e0e0;font-family:Outfit,Segoe UI,sans-serif;margin:0;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;padding:10px 20px;background:rgba(20,20,25,.85)}
.top-bar h1{margin:0;color:#f59e0b;font-size:1.3em}
#benny3D{width:100vw;height:calc(100vh - 53px);display:block;cursor:grab}
.hud{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.7);padding:10px 14px;border-radius:8px}
.btn{padding:8px 14px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="top-bar"><h1>Where is Benny?</h1><span id="status">drag to look — click when you see him</span></div>
<canvas id="benny3D"></canvas>
<div class="hud"><span>Finds: <strong id="finds">0</strong> | Clicks: <strong id="clicks">0</strong></span> <button class="btn" onclick="hideBenny()">Hide again</button> <a href="/"><button class="btn">Back</button></a></div>
<script src="puzzle-games/where-is-benny.js"></script>
</body>
</html>
