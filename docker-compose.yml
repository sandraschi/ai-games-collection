# Games Collection - Docker Compose (full engine stack)
#
# All three AI engines run in Docker containers:
#   - Stockfish (Linux, compiled from source)
#   - KataGo  (Linux, downloaded from GitHub)
#   - YaneuraOu (Linux, downloaded from GitHub)
#
# Naked-PC alternative: run the engine servers directly:
#   uv run python engines/stockfish-server.py
#   uv run python engines/go-server.py
#   uv run python engines/shogi-server.py
#
# Ports:
#   10987  — FastAPI + FastMCP gateway
#   11211  — Stockfish (Docker)
#   11212  — YaneuraOu (Docker)
#   11213  — KataGo (Docker)

services:
  games-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: games-gateway
    ports:
      - "10987:10987"
    environment:
      - AI_GAMES_COLLECTION_BACKEND_PORT=10987
      - STOCKFISH_URL=http://stockfish-engine:11211
      - SHOGI_URL=http://shogi-engine:11212
      - GO_URL=http://go-engine:11213
      - EDAX_URL=http://edax-engine:11214
      - GNUBG_URL=http://gnubg-engine:11215
      - OPENSPIEL_URL=http://openspiel-engine:11216
      - MOHEX_URL=http://mohex-engine:11210
      - AI_GAMES_COLLECTION_MCP_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10987/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      stockfish-engine:
        condition: service_started
      shogi-engine:
        condition: service_started
      go-engine:
        condition: service_started
    networks:
      - games-net

  stockfish-engine:
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    container_name: games-stockfish
    ports:
      - "11211:11211"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11211/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  shogi-engine:
    build:
      context: .
      dockerfile: Dockerfile.yaneuraou
    container_name: games-shogi
    ports:
      - "11212:11212"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11212/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  go-engine:
    build:
      context: .
      dockerfile: Dockerfile.katago
    container_name: games-go
    ports:
      - "11213:11213"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11213/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  edax-engine:
    build:
      context: .
      dockerfile: Dockerfile.edax
    container_name: games-edax
    ports:
      - "11214:11214"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11214/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - games-net

  gnubg-engine:
    build:
      context: .
      dockerfile: Dockerfile.gnubg
    container_name: games-gnubg
    ports:
      - "11215:11215"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11215/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - games-net

  openspiel-engine:
    build:
      context: .
      dockerfile: Dockerfile.openspiel
    container_name: games-openspiel
    ports:
      - "11216:11216"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11216/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - games-net

  mohex-engine:
    build:
      context: .
      dockerfile: Dockerfile.mohex
    container_name: games-mohex
    ports:
      - "11210:11210"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11210/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - games-net

networks:
  games-net:
    driver: bridge

