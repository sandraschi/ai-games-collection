[package]
name = "avatar-native"
version = "0.1.0"
edition = "2021"
description = "Native VRM viewer: bevy + bevy_vrm1 + rapier — Nekomimi-chan"

[dependencies]
bevy = { version = "0.14", default-features = false, features = ["bevy_asset", "bevy_scene", "bevy_winit", "bevy_render", "bevy_pbr", "x11"] }
bevy_vrm1 = "0.6"
bevy_rapier3d = "0.27"

[profile.dev]
opt-level = 1
